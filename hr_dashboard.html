<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานผู้บริหาร — PHONGWARIN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',Arial,sans-serif;background:#f0f4f8;min-height:100vh;padding:16px}
.header{background:#1a3a5c;padding:20px 28px;border-radius:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-company{font-size:22px;font-weight:600;color:#fff;margin-bottom:4px}
.header-sub{font-size:14px;color:rgba(255,255,255,.75)}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.month-sel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 16px;border-radius:8px;font-size:16px;cursor:pointer}
.month-sel option{color:#000;background:#fff}
.refresh-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 16px;border-radius:8px;font-size:15px;cursor:pointer}
.refresh-btn:hover{background:rgba(255,255,255,.25)}
.sync-status{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px}
.kpi-label{font-size:15px;color:#64748b;margin-bottom:10px}
.kpi-value{font-size:36px;font-weight:600;color:#1a3a5c;line-height:1}
.kpi-value-sm{font-size:22px;font-weight:600;color:#1a3a5c;line-height:1.3;padding-top:2px}
.kpi-sub{font-size:14px;margin-top:8px}
.good{color:#0f6e56}.warn{color:#ba7517}.bad{color:#a32d2d}
.main-row{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:22px}
.card-title{font-size:18px;font-weight:600;color:#1a3a5c;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #e2e8f0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-size:15px;color:#334155;width:130px;flex-shrink:0}
.bar-track{flex:1;height:28px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:10px;transition:width .6s ease}
.bar-score{font-size:14px;font-weight:600;color:#fff}
.emp-table{width:100%;border-collapse:collapse;font-size:15px}
.emp-table th{text-align:left;padding:10px 12px;color:#64748b;font-weight:600;border-bottom:2px solid #e2e8f0;font-size:14px}
.emp-table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#1e293b}
.emp-table tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:15px;font-weight:600}
.badge-hi{background:#dcfce7;color:#166534}
.badge-mid{background:#fef3c7;color:#92400e}
.badge-lo{background:#fee2e2;color:#991b1b}
.rank-num{color:#94a3b8;font-size:14px;margin-right:4px}
.loading{text-align:center;padding:60px;font-size:18px;color:#64748b}
.error-box{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:20px;margin:20px 0;color:#991b1b;font-size:15px}
.no-data{text-align:center;padding:30px;color:#94a3b8;font-size:15px}
@media(max-width:900px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .main-row{grid-template-columns:1fr}
  .header{flex-direction:column;align-items:flex-start}
  .bar-label{width:100px;font-size:13px}
}
@media(max-width:500px){
  body{padding:10px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-value{font-size:28px}
  .card{padding:16px}
  .card-title{font-size:16px}
  .emp-table{font-size:14px}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-company">PHONGWARIN Printing Limited</div>
    <div class="header-sub">สรุปผลการประเมินพนักงาน</div>
    <div class="sync-status" id="sync-status">⏳ กำลังโหลดข้อมูล...</div>
  </div>
  <div class="header-right">
    <select class="month-sel" id="month-sel" onchange="renderAll()">
      <option value="">-- ทุกเดือน --</option>
    </select>
    <button class="refresh-btn" onclick="loadData()">🔄 รีเฟรช</button>
  </div>
</div>

<div id="main-content">
  <div class="loading">⏳ กำลังดึงข้อมูลจาก Cloud...</div>
</div>

<script>
const GS_URL = 'https://script.google.com/macros/s/AKfycbyaAeSLrDT8pZFfFwrq_3EhRPLkRL-DtIDwr42fuFmHZJTL4M_D09NmV-jPHzBagRrjVw/exec';
let S = null;

function barColor(score){
  if(score >= 85) return '#1d9e75';
  if(score >= 75) return '#378add';
  if(score >= 65) return '#ba7517';
  return '#d85a30';
}

function badgeClass(score){
  if(score >= 85) return 'badge-hi';
  if(score >= 70) return 'badge-mid';
  return 'badge-lo';
}

function curMonth(){
  const d = new Date();
  return d.toLocaleDateString('th-TH',{year:'numeric',month:'2-digit'}).split('/').reverse().join('-');
}

async function loadData(){
  document.getElementById('sync-status').textContent = '⏳ กำลังดึงข้อมูล...';
  try{
    const res = await fetch(GS_URL + '?action=pull&_=' + Date.now());
    const j = await res.json();
    if(j && j.data){
      S = j.data;
      document.getElementById('sync-status').textContent = '✅ อัปเดตล่าสุด: ' + new Date().toLocaleTimeString('th-TH');
      buildMonthOptions();
      renderAll();
    } else {
      document.getElementById('sync-status').textContent = '⚠️ ไม่พบข้อมูลใน Cloud';
      showError('ไม่พบข้อมูล กรุณาตรวจสอบว่ามีการบันทึกข้อมูลในระบบแล้ว');
    }
  } catch(e){
    document.getElementById('sync-status').textContent = '❌ เชื่อมต่อไม่ได้';
    showError('ไม่สามารถดึงข้อมูลได้ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');
  }
}

function showError(msg){
  document.getElementById('main-content').innerHTML = `<div class="error-box">⚠️ ${msg}</div>`;
}

function formatMonthTH(m){
  // m = "2026-05" format
  if(!m) return m;
  const parts = m.split('-');
  if(parts.length < 2) return m;
  const year = parseInt(parts[0]) + 543;
  const months = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const mon = months[parseInt(parts[1])] || parts[1];
  return mon + ' ' + year;
}

function buildMonthOptions(){
  if(!S || !S.evaluations) return;
  const months = [...new Set(S.evaluations.map(e => e.month||'').filter(Boolean))].sort().reverse();
  const sel = document.getElementById('month-sel');
  const cur = sel.value;
  sel.innerHTML = '<option value="">-- ทุกเดือน --</option>';
  months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = formatMonthTH(m);
    if(m === cur) opt.selected = true;
    sel.appendChild(opt);
  });
  // Auto-select latest month
  if(!cur && months.length > 0) sel.value = months[0];
}

function getFilteredEvals(){
  if(!S || !S.evaluations) return [];
  const month = document.getElementById('month-sel').value;
  if(!month) return S.evaluations;
  return S.evaluations.filter(e => e.month === month);
}

function getEmployeeName(empId){
  if(!S || !S.employees) return empId;
  const emp = S.employees.find(e => e.id === empId || e.name === empId);
  return emp ? (emp.name || emp.display || empId) : empId;
}

function getDeptName(deptId){
  if(!S || !S.departments) return deptId;
  const dept = S.departments.find(d => d.id === deptId || d.name === deptId);
  return dept ? (dept.name || deptId) : deptId;
}

function calcScore(ev){
  // หาคะแนนรวมจาก scores object หรือ total
  if(ev.total !== undefined) return parseFloat(ev.total) || 0;
  if(ev.score !== undefined) return parseFloat(ev.score) || 0;
  if(ev.scores && typeof ev.scores === 'object'){
    const vals = Object.values(ev.scores).map(v => parseFloat(v)||0);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
  }
  return 0;
}

function renderAll(){
  if(!S) return;
  const evals = getFilteredEvals();
  if(evals.length === 0){
    document.getElementById('main-content').innerHTML = '<div class="no-data">ไม่มีข้อมูลสำหรับเดือนที่เลือก</div>';
    return;
  }

  // คำนวณคะแนน — โครงสร้างข้อมูล: eid=employee id, totalScore=คะแนน, dept อยู่ใน employees
  const empScores = {};
  const deptScores = {};

  // สร้าง map พนักงาน id → ข้อมูล
  const empMap = {};
  if(S.employees) S.employees.forEach(e => { empMap[e.id] = e; });

  evals.forEach(ev => {
    const score = ev.totalScore !== undefined ? parseFloat(ev.totalScore)||0 : calcScore(ev);
    const empId = ev.eid !== undefined ? ev.eid : (ev.employeeId || ev.employee || '');
    const empInfo = empMap[empId] || {};
    const deptKey = empInfo.dept || ev.department || ev.dept || '';

    if(empId !== ''){
      if(!empScores[empId]) empScores[empId] = {total:0, count:0, dept: deptKey, info: empInfo};
      empScores[empId].total += score;
      empScores[empId].count++;
    }
    if(deptKey){
      if(!deptScores[deptKey]) deptScores[deptKey] = {total:0, count:0};
      deptScores[deptKey].total += score;
      deptScores[deptKey].count++;
    }
  });

  const empList = Object.entries(empScores).map(([id,v])=>({
    id,
    name: v.info.name || v.info.display || id,
    dept: v.dept || '-',
    avg: v.count ? +(v.total/v.count).toFixed(1) : 0
  })).sort((a,b)=>b.avg-a.avg);

  const deptList = Object.entries(deptScores).map(([name,v])=>({
    id: name, name: name,
    avg: v.count ? +(v.total/v.count).toFixed(1) : 0
  })).sort((a,b)=>b.avg-a.avg);

  const totalAvg = empList.length ? +(empList.reduce((s,e)=>s+e.avg,0)/empList.length).toFixed(1) : 0;
  const topDept = deptList[0];
  const botDept = deptList[deptList.length-1];
  const maxDeptScore = deptList[0]?.avg || 100;

  const top10 = empList.slice(0,10);
  const bot10 = [...empList].sort((a,b)=>a.avg-b.avg).slice(0,10);

  document.getElementById('main-content').innerHTML = `
  <div class="kpi-grid">
    <div class="kpi">
      <div class="kpi-label">คะแนนเฉลี่ยทั้งบริษัท</div>
      <div class="kpi-value">${totalAvg}</div>
      <div class="kpi-sub" style="color:#64748b">จากพนักงาน ${empList.length} คน</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">จำนวนที่ประเมินแล้ว</div>
      <div class="kpi-value">${evals.length}</div>
      <div class="kpi-sub" style="color:#64748b">รายการประเมิน</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">แผนกที่ดีที่สุด</div>
      <div class="kpi-value-sm">${topDept ? topDept.name : '-'}</div>
      <div class="kpi-sub good">คะแนนเฉลี่ย ${topDept ? topDept.avg : '-'}</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">แผนกที่ต้องพัฒนา</div>
      <div class="kpi-value-sm">${botDept ? botDept.name : '-'}</div>
      <div class="kpi-sub warn">คะแนนเฉลี่ย ${botDept ? botDept.avg : '-'}</div>
    </div>
  </div>

  <div class="main-row">
    <div class="card">
      <div class="card-title">คะแนนเฉลี่ยแยกแผนก</div>
      ${deptList.length === 0 ? '<div class="no-data">ไม่มีข้อมูลแผนก</div>' :
        deptList.map(d => `
        <div class="bar-row">
          <div class="bar-label">${d.name}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${Math.round(d.avg)}%;background:${barColor(d.avg)}">
              <span class="bar-score">${d.avg}</span>
            </div>
          </div>
        </div>`).join('')}
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card">
        <div class="card-title">พนักงานคะแนนสูงสุด 10 คน</div>
        ${top10.length === 0 ? '<div class="no-data">ไม่มีข้อมูล</div>' : `
        <table class="emp-table">
          <tr><th>#</th><th>ชื่อ</th><th>แผนก</th><th>คะแนน</th></tr>
          ${top10.map((e,i)=>`
          <tr>
            <td><span class="rank-num">${i+1}</span></td>
            <td>${e.name}</td>
            <td style="font-size:13px;color:#64748b">${e.dept}</td>
            <td><span class="badge ${badgeClass(e.avg)}">${e.avg}</span></td>
          </tr>`).join('')}
        </table>`}
      </div>
      <div class="card">
        <div class="card-title">พนักงานที่ต้องดูแลเป็นพิเศษ 10 คน</div>
        ${bot10.length === 0 ? '<div class="no-data">ไม่มีข้อมูล</div>' : `
        <table class="emp-table">
          <tr><th>#</th><th>ชื่อ</th><th>แผนก</th><th>คะแนน</th></tr>
          ${bot10.map((e,i)=>`
          <tr>
            <td><span class="rank-num">${i+1}</span></td>
            <td>${e.name}</td>
            <td style="font-size:13px;color:#64748b">${e.dept}</td>
            <td><span class="badge ${badgeClass(e.avg)}">${e.avg}</span></td>
          </tr>`).join('')}
        </table>`}
      </div>
    </div>
  </div>`;
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
