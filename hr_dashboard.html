<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานผู้บริหาร — PHONGWARIN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Sarabun",Arial,sans-serif;background:#f0f4f8;min-height:100vh;padding:16px;font-size:17px}
.header{background:#1a3a5c;padding:20px 28px;border-radius:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header-company{font-size:26px;font-weight:600;color:#fff;margin-bottom:4px}
.header-sub{font-size:16px;color:rgba(255,255,255,.75)}
.header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.month-sel{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 16px;border-radius:8px;font-size:16px;cursor:pointer}
.month-sel option{color:#000;background:#fff;font-size:16px}
.refresh-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 16px;border-radius:8px;font-size:15px;cursor:pointer}
.refresh-btn:hover{background:rgba(255,255,255,.25)}
.sync-status{font-size:15px;color:rgba(255,255,255,.7);margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px 22px}
.kpi-label{font-size:17px;color:#64748b;margin-bottom:10px}
.kpi-value{font-size:42px;font-weight:600;color:#1a3a5c;line-height:1}
.kpi-value-sm{font-size:26px;font-weight:600;color:#1a3a5c;line-height:1.3;padding-top:2px}
.kpi-sub{font-size:16px;margin-top:8px}
.good{color:#0f6e56}.warn{color:#ba7517}.bad{color:#a32d2d}
.main-row{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:22px}
.card-title{font-size:21px;font-weight:600;color:#1a3a5c;margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #e2e8f0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;border-radius:8px;padding:4px;transition:background .15s}
.bar-row:hover{background:#f1f5f9}
.bar-row:active{background:#e2e8f0}
.bar-label{font-size:17px;color:#334155;width:130px;flex-shrink:0}
.bar-track{flex:1;height:28px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:10px;transition:width .6s ease}
.bar-score{font-size:16px;font-weight:600;color:#fff}
.bar-arrow{font-size:22px;color:#94a3b8;flex-shrink:0}
.dept-page{display:none;position:fixed;inset:0;background:#f0f4f8;z-index:1000;overflow-y:auto;animation:slideIn .25s ease}
.dept-page.open{display:block}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.dept-topbar{background:#1a3a5c;padding:18px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.dept-back{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:10px 18px;border-radius:8px;font-size:17px;cursor:pointer}
.dept-back:hover{background:rgba(255,255,255,.25)}
.dept-topbar-info{flex:1}
.dept-title{font-size:22px;font-weight:700;color:#fff}
.dept-subtitle{font-size:15px;color:rgba(255,255,255,.75);margin-top:3px}
.dept-content{padding:20px;max-width:800px;margin:0 auto}
.emp-table{width:100%;border-collapse:collapse;font-size:17px}
.emp-table th{text-align:left;padding:10px 12px;color:#64748b;font-weight:600;border-bottom:2px solid #e2e8f0;font-size:16px}
.emp-table td{padding:12px 12px;border-bottom:1px solid #f1f5f9;color:#1e293b}
.emp-table tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:6px 18px;border-radius:20px;font-size:17px;font-weight:600}
.badge-hi{background:#dcfce7;color:#166534}
.badge-mid{background:#fef3c7;color:#92400e}
.badge-lo{background:#fee2e2;color:#991b1b}
.rank-num{color:#94a3b8;font-size:16px;margin-right:4px}
.loading{text-align:center;padding:60px;font-size:20px;color:#64748b}
.error-box{background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:20px;margin:20px 0;color:#991b1b;font-size:17px}
.no-data{text-align:center;padding:30px;color:#94a3b8;font-size:17px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.main-row{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start}.bar-label{width:100px;font-size:13px}}
@media(max-width:500px){body{padding:10px}.kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}.kpi-value{font-size:32px}.card{padding:18px}.card-title{font-size:19px}.emp-table{font-size:16px}}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-company">PHONGWARIN Printing Limited</div>
    <div class="header-sub">สรุปผลการประเมินพนักงาน</div>
    <div class="sync-status" id="sync-status">กำลังโหลดข้อมูล...</div>
  </div>
  <div class="header-right">
    <select class="month-sel" id="month-sel" onchange="renderAll()">
      <option value="">-- ทุกเดือน --</option>
    </select>
    <button class="refresh-btn" onclick="loadData()">รีเฟรช</button>
  </div>
</div>

<div id="main-content"><div class="loading">กำลังดึงข้อมูลจาก Cloud...</div></div>

<!-- Dept Full Page -->
<div class="dept-page" id="dept-page">
  <div class="dept-topbar">
    <button class="dept-back" onclick="closeDeptPage()">&#8592; กลับ</button>
    <div class="dept-topbar-info">
      <div class="dept-title" id="dept-page-name"></div>
      <div class="dept-subtitle" id="dept-page-avg"></div>
    </div>
  </div>
  <div class="dept-content">
    <div class="card" style="margin-top:0">
      <table class="emp-table">
        <thead><tr><th>#</th><th>ชื่อพนักงาน</th><th style="text-align:center">ฝีมือ</th><th style="text-align:center">พฤติกรรม</th><th style="text-align:center">รวม</th></tr></thead>
        <tbody id="dept-emp-list"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const GS_URL="https://script.google.com/macros/s/AKfycbyaAeSLrDT8pZFfFwrq_3EhRPLkRL-DtIDwr42fuFmHZJTL4M_D09NmV-jPHzBagRrjVw/exec";
let S=null;
window._deptList=[];

function barColor(s){return s>=85?"#1d9e75":s>=75?"#378add":s>=65?"#ba7517":"#d85a30"}
function badgeClass(s){return s>=85?"badge-hi":s>=70?"badge-mid":"badge-lo"}
function formatMonthTH(m){
  if(!m)return m;
  var p=m.split("-");if(p.length<2)return m;
  var y=parseInt(p[0])+543;
  var mn=["","ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  return(mn[parseInt(p[1])]||p[1])+" "+y;
}
function calcScore(ev){
  if(ev.totalScore!==undefined)return parseFloat(ev.totalScore)||0;
  if(ev.score!==undefined)return parseFloat(ev.score)||0;
  return 0;
}

async function loadData(){
  document.getElementById("sync-status").textContent="กำลังดึงข้อมูล...";
  try{
    var res=await fetch(GS_URL+"?action=pull&_="+Date.now());
    var j=await res.json();
    if(j&&j.data){
      S=j.data;
      document.getElementById("sync-status").textContent="อัปเดตล่าสุด: "+new Date().toLocaleTimeString("th-TH");
      buildMonthOptions();renderAll();
    }else{
      document.getElementById("sync-status").textContent="ไม่พบข้อมูล";
      document.getElementById("main-content").innerHTML="<div class=\"error-box\">ไม่พบข้อมูล</div>";
    }
  }catch(e){
    document.getElementById("sync-status").textContent="เชื่อมต่อไม่ได้";
    document.getElementById("main-content").innerHTML="<div class=\"error-box\">ไม่สามารถดึงข้อมูลได้</div>";
  }
}

function buildMonthOptions(){
  if(!S||!S.evaluations)return;
  var months=[...new Set(S.evaluations.map(function(e){return e.month||""}).filter(Boolean))].sort().reverse();
  var sel=document.getElementById("month-sel");
  var cur=sel.value;
  sel.innerHTML="<option value=\"\">-- ทุกเดือน --</option>";
  months.forEach(function(m){
    var opt=document.createElement("option");
    opt.value=m;opt.textContent=formatMonthTH(m);
    if(m===cur)opt.selected=true;
    sel.appendChild(opt);
  });
  if(!cur&&months.length>0)sel.value=months[0];
}

function renderAll(){
  if(!S)return;
  var month=document.getElementById("month-sel").value;
  var evals=S.evaluations||[];
  if(month)evals=evals.filter(function(e){return e.month===month});
  if(evals.length===0){
    document.getElementById("main-content").innerHTML="<div class=\"no-data\">ไม่มีข้อมูลสำหรับเดือนที่เลือก</div>";
    return;
  }
  var empMap={};
  if(S.employees)S.employees.forEach(function(e){empMap[e.id]=e});

  var empScores={};
  var deptData={};

  evals.forEach(function(ev){
    var score=calcScore(ev);
    var empId=ev.eid!==undefined?ev.eid:(ev.employeeId||ev.employee||"");
    var empInfo=empMap[empId]||{};
    var dept=empInfo.dept||ev.department||ev.dept||"";

    if(empId!==""){
      if(!empScores[empId])empScores[empId]={total:0,count:0,dept:dept,info:empInfo};
      empScores[empId].total+=score;
      empScores[empId].count++;
    }
    if(dept){
      if(!deptData[dept])deptData[dept]={total:0,count:0,emps:{}};
      deptData[dept].total+=score;
      deptData[dept].count++;
      if(empId!==""){
        if(!deptData[dept].emps[empId])deptData[dept].emps[empId]={name:empInfo.name||String(empId),total:0,count:0,skill:0,behav:0};
        deptData[dept].emps[empId].total+=score;
        deptData[dept].emps[empId].skill+=parseFloat(ev.skillPct)||0;
        deptData[dept].emps[empId].behav+=parseFloat(ev.behavPct)||0;
        deptData[dept].emps[empId].count++;
      }
    }
  });

  var empList=Object.entries(empScores).map(function(kv){
    var id=kv[0],v=kv[1];
    return{id:id,name:v.info.name||id,dept:v.dept||"-",avg:v.count?+(v.total/v.count).toFixed(1):0};
  }).sort(function(a,b){return b.avg-a.avg});

  var deptList=Object.entries(deptData).map(function(kv){
    var name=kv[0],v=kv[1];
    var avg=v.count?+(v.total/v.count).toFixed(1):0;
    var emps=Object.entries(v.emps).map(function(ev2){
      var eid=ev2[0],ed=ev2[1];
      return{id:eid,name:ed.name,
        score:ed.count?+(ed.total/ed.count).toFixed(1):0,
        skill:ed.count?+(ed.skill/ed.count).toFixed(1):0,
        behav:ed.count?+(ed.behav/ed.count).toFixed(1):0};
    }).sort(function(a,b){return b.score-a.score});
    return{name:name,avg:avg,emps:emps};
  }).sort(function(a,b){return b.avg-a.avg});

  window._deptList=deptList;

  var totalAvg=empList.length?+(empList.reduce(function(s,e){return s+e.avg},0)/empList.length).toFixed(1):0;
  var topDept=deptList[0];
  var botDept=deptList[deptList.length-1];
  var top10=empList.slice(0,10);
  var bot10=[].concat(empList).sort(function(a,b){return a.avg-b.avg}).slice(0,10);

  function empRows(list){
    return list.map(function(e,i){
      return"<tr><td><span class=\"rank-num\">"+(i+1)+"</span></td><td>"+e.name+"</td><td style=\"font-size:15px;color:#64748b\">"+e.dept+"</td><td><span class=\"badge "+badgeClass(e.avg)+"\">"+e.avg+"</span></td></tr>";
    }).join("");
  }

  function deptRows(){
    if(deptList.length===0)return"<div class=\"no-data\">ไม่มีข้อมูลแผนก</div>";
    return deptList.map(function(d,i){
      return"<div class=\"bar-row\" onclick=\"openDeptModal("+i+")\"><div class=\"bar-label\">"+d.name+"</div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:"+Math.round(d.avg)+"%;background:"+barColor(d.avg)+"\"><span class=\"bar-score\">"+d.avg+"</span></div></div><div class=\"bar-arrow\">&rsaquo;</div></div>";
    }).join("");
  }

  document.getElementById("main-content").innerHTML=
  "<div class=\"kpi-grid\">"+
    "<div class=\"kpi\"><div class=\"kpi-label\">คะแนนเฉลี่ยทั้งบริษัท</div><div class=\"kpi-value\">"+totalAvg+"</div><div class=\"kpi-sub\" style=\"color:#64748b\">จากพนักงาน "+empList.length+" คน</div></div>"+
    "<div class=\"kpi\"><div class=\"kpi-label\">จำนวนที่ประเมินแล้ว</div><div class=\"kpi-value\">"+evals.length+"</div><div class=\"kpi-sub\" style=\"color:#64748b\">รายการประเมิน</div></div>"+
    "<div class=\"kpi\"><div class=\"kpi-label\">แผนกที่ดีที่สุด</div><div class=\"kpi-value-sm\">"+(topDept?topDept.name:"-")+"</div><div class=\"kpi-sub good\">คะแนนเฉลี่ย "+(topDept?topDept.avg:"-")+"</div></div>"+
    "<div class=\"kpi\"><div class=\"kpi-label\">แผนกที่ต้องพัฒนา</div><div class=\"kpi-value-sm\">"+(botDept?botDept.name:"-")+"</div><div class=\"kpi-sub warn\">คะแนนเฉลี่ย "+(botDept?botDept.avg:"-")+"</div></div>"+
  "</div>"+
  "<div class=\"main-row\">"+
    "<div class=\"card\"><div class=\"card-title\">คะแนนเฉลี่ยแยกแผนก <span style=\"font-size:15px;font-weight:400;color:#94a3b8\">&#128070; กดแถบเพื่อดูรายชื่อ</span></div>"+deptRows()+"</div>"+
    "<div style=\"display:flex;flex-direction:column;gap:14px\">"+
      "<div class=\"card\"><div class=\"card-title\">พนักงานคะแนนสูงสุด 10 คน</div>"+
        (top10.length===0?"<div class=\"no-data\">ไม่มีข้อมูล</div>":"<table class=\"emp-table\"><tr><th>#</th><th>ชื่อ</th><th>แผนก</th><th>คะแนน</th></tr>"+empRows(top10)+"</table>")+
      "</div>"+
      "<div class=\"card\"><div class=\"card-title\">พนักงานที่ต้องดูแลเป็นพิเศษ 10 คน</div>"+
        (bot10.length===0?"<div class=\"no-data\">ไม่มีข้อมูล</div>":"<table class=\"emp-table\"><tr><th>#</th><th>ชื่อ</th><th>แผนก</th><th>คะแนน</th></tr>"+empRows(bot10)+"</table>")+
      "</div>"+
    "</div>"+
  "</div>";
}

function openDeptModal(idx){
  var dept=window._deptList[idx];
  if(!dept)return;
  document.getElementById("dept-page-name").textContent=dept.name;
  document.getElementById("dept-page-avg").textContent="คะแนนเฉลี่ย: "+dept.avg+" | พนักงาน "+dept.emps.length+" คน";
  var tbody=document.getElementById("dept-emp-list");
  if(dept.emps.length===0){
    tbody.innerHTML="<tr><td colspan=\"5\" style=\"text-align:center;padding:30px;color:#94a3b8;font-size:17px\">ไม่มีข้อมูล</td></tr>";
  }else{
    tbody.innerHTML=dept.emps.map(function(e,i){
      return"<tr>"+
        "<td><span class=\"rank-num\">"+(i+1)+"</span></td>"+
        "<td style=\"font-weight:500\">"+e.name+"</td>"+
        "<td style=\"text-align:center\"><span class=\"badge "+badgeClass(e.skill)+"\">"+e.skill+"%</span></td>"+
        "<td style=\"text-align:center\"><span class=\"badge "+badgeClass(e.behav)+"\">"+e.behav+"%</span></td>"+
        "<td style=\"text-align:center\"><span class=\"badge "+badgeClass(e.score)+"\">"+e.score+"</span></td>"+
      "</tr>";
    }).join("");
  }
  document.getElementById("dept-page").classList.add("open");
  window.scrollTo(0,0);
  document.body.style.overflow="hidden";
}

function closeDeptPage(){
  document.getElementById("dept-page").classList.remove("open");
  document.body.style.overflow="";
}

loadData();
setInterval(loadData,60000);
</script>
</body>
</html>
